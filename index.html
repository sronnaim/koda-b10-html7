<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='HTML Grid implementation on a calculator UI'>
    <title>HTML Grid Calculator</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <main>
        <article>
            <h1>HTML Grid Calculator</h1>

            <section>
                <div class="calc">
                    <div class="calc-output">
                        <div class="output-result">67</div>
                        <div class="output-operation">67 + 0</div>
                    </div>
                    <div class="calc-input">
                        <button class="btn">Del</button>
                        <button class="btn">Log</button>
                        <button class="btn">&infin;</button>
                        <button class="btn">&divide;</button>
                        <button class="btn">1</button>
                        <button class="btn">2</button>
                        <button class="btn">3</button>
                        <button class="btn">&times;</button>
                        <button class="btn">4</button>
                        <button class="btn">5</button>
                        <button class="btn">6</button>
                        <button class="btn">+</button>
                        <button class="btn">7</button>
                        <button class="btn">8</button>
                        <button class="btn">9</button>
                        <button class="btn">&minus;</button>
                        <button class="btn">Result</button>
                        <button class="btn">0</button>
                        <button class="btn">,</button>
                    </div>
                </div>
            </section>
        </article>
    </main>    
</body>
</html>
